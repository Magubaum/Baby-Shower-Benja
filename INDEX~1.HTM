<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Baby Shower Benja 🍼</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="topbar">
    <h1>🍼 Baby Shower Benja</h1>
    <p>Elegí un regalo y marcalo como tuyo. Apenas lo hacés, se bloquea para que no se repita.</p>
  </div>

  <div class="contenedor">

    <div class="progreso">
      <div class="progreso-barra"><div class="progreso-barra-fill" id="barraFill" style="width:0%"></div></div>
      <div class="progreso-texto" id="progresoTexto">Cargando...</div>
    </div>

    <div class="filtros" id="filtros"></div>

    <div id="estadoCarga" class="estado-msg">Cargando la lista de regalos... 🎁</div>
    <div class="grid" id="grid"></div>

    <div class="footer-link">
      <a href="admin.html">Panel de la organizadora</a>
    </div>
  </div>

  <!-- Modal para marcar como comprado -->
  <div class="overlay hidden" id="overlay">
    <div class="modal">
      <h3 id="modalTitulo">¿Vas a regalar esto?</h3>
      <p style="color:var(--texto-suave); font-size:0.9rem; margin-top:-6px;">Contanos tu nombre para que sepamos a quién agradecer 💛</p>
      <input type="text" id="inputNombre" placeholder="Tu nombre" maxlength="60" />
      <div class="estado-msg" id="modalError" style="padding:0 0 10px; color:#B23A3A; display:none;"></div>
      <div class="modal-acciones">
        <button class="btn btn-secundario" id="btnCancelar">Cancelar</button>
        <button class="btn btn-comprar" id="btnConfirmar">Confirmar</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getFirestore, collection, onSnapshot, doc, runTransaction, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import { firebaseConfig } from './firebase-config.js';

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const regalosRef = collection(db, 'regalos');

    let regalos = [];
    let categoriaActiva = 'Todos';
    let regaloSeleccionado = null;

    const grid = document.getElementById('grid');
    const estadoCarga = document.getElementById('estadoCarga');
    const filtrosEl = document.getElementById('filtros');
    const barraFill = document.getElementById('barraFill');
    const progresoTexto = document.getElementById('progresoTexto');
    const overlay = document.getElementById('overlay');
    const inputNombre = document.getElementById('inputNombre');
    const modalTitulo = document.getElementById('modalTitulo');
    const modalError = document.getElementById('modalError');

    onSnapshot(regalosRef, (snap) => {
      regalos = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      estadoCarga.classList.add('hidden');
      renderFiltros();
      render();
    }, (err) => {
      estadoCarga.textContent = 'No se pudo cargar la lista. Revisá la configuración de Firebase (firebase-config.js).';
      console.error(err);
    });

    function renderFiltros() {
      const categorias = ['Todos', ...new Set(regalos.map(r => r.categoria || 'Otros'))];
      filtrosEl.innerHTML = '';
      categorias.forEach(cat => {
        const chip = document.createElement('button');
        chip.className = 'chip' + (cat === categoriaActiva ? ' activo' : '');
        chip.textContent = cat;
        chip.onclick = () => { categoriaActiva = cat; render(); renderFiltros(); };
        filtrosEl.appendChild(chip);
      });
    }

    function render() {
      const visibles = categoriaActiva === 'Todos'
        ? regalos
        : regalos.filter(r => (r.categoria || 'Otros') === categoriaActiva);

      const comprados = regalos.filter(r => r.estado === 'comprado').length;
      const total = regalos.length;
      barraFill.style.width = total ? `${Math.round((comprados/total)*100)}%` : '0%';
      progresoTexto.textContent = `${comprados} de ${total} regalos ya tienen dueño 🎉`;

      grid.innerHTML = '';
      visibles
        .slice()
        .sort((a,b) => (a.estado === b.estado ? 0 : a.estado === 'comprado' ? 1 : -1))
        .forEach(r => grid.appendChild(renderCard(r)));
    }

    function renderCard(r) {
      const card = document.createElement('div');
      card.className = 'card' + (r.estado === 'comprado' ? ' comprado' : '');

      const badge = document.createElement('span');
      badge.className = 'badge-categoria';
      badge.textContent = r.categoria || 'Otros';
      card.appendChild(badge);

      if (r.estado === 'comprado') {
        const ribbon = document.createElement('span');
        ribbon.className = 'ribbon-comprado';
        ribbon.textContent = '✅ Comprado';
        card.appendChild(ribbon);
      }

      const h3 = document.createElement('h3');
      h3.textContent = r.nombre;
      card.appendChild(h3);

      if (r.marcas) {
        const p = document.createElement('div');
        p.className = 'marcas';
        p.textContent = `Opciones: ${r.marcas}`;
        card.appendChild(p);
      }

      if (r.notas) {
        const p = document.createElement('div');
        p.className = 'notas';
        p.textContent = r.notas;
        card.appendChild(p);
      }

      if (r.referencia) {
        const a = document.createElement('a');
        a.className = 'link-ref';
        a.href = r.referencia;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.textContent = 'Ver referencia →';
        card.appendChild(a);
      }

      if (r.estado === 'comprado') {
        const p = document.createElement('div');
        p.className = 'comprado-por';
        p.textContent = `Regalado por ${r.compradoPor || 'alguien'} 💛`;
        card.appendChild(p);
      } else {
        const btn = document.createElement('button');
        btn.className = 'btn btn-comprar';
        btn.textContent = '🎁 Marcar como comprado';
        btn.onclick = () => abrirModal(r);
        card.appendChild(btn);
      }

      return card;
    }

    function abrirModal(r) {
      regaloSeleccionado = r;
      modalTitulo.textContent = `¿Vas a regalar "${r.nombre}"?`;
      inputNombre.value = '';
      modalError.style.display = 'none';
      overlay.classList.remove('hidden');
      inputNombre.focus();
    }

    document.getElementById('btnCancelar').onclick = () => overlay.classList.add('hidden');

    document.getElementById('btnConfirmar').onclick = async () => {
      const nombre = inputNombre.value.trim();
      if (!nombre) {
        modalError.textContent = 'Necesitamos tu nombre para confirmar.';
        modalError.style.display = 'block';
        return;
      }
      try {
        const refDoc = doc(db, 'regalos', regaloSeleccionado.id);
        await runTransaction(db, async (tx) => {
          const snap = await tx.get(refDoc);
          if (!snap.exists() || snap.data().estado !== 'disponible') {
            throw new Error('YA_TOMADO');
          }
          tx.update(refDoc, {
            estado: 'comprado',
            compradoPor: nombre,
            fechaComprado: serverTimestamp(),
          });
        });
        overlay.classList.add('hidden');
      } catch (e) {
        if (e.message === 'YA_TOMADO') {
          modalError.textContent = 'Uy, justo lo acaban de marcar. Elegí otro regalo 🙈';
        } else {
          modalError.textContent = 'Hubo un error, probá de nuevo.';
          console.error(e);
        }
        modalError.style.display = 'block';
      }
    };

    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) overlay.classList.add('hidden');
    });
  </script>
</body>
</html>
